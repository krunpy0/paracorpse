<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PARACORPSE</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // Encodes path and query into hash and redirects to index.html
      var path = window.location.pathname;
      var repoBase = "/paracorpse";
      var subPath = path.startsWith(repoBase) ? path.slice(repoBase.length) : path;
      if (subPath.startsWith("/admin")) {
        window.location.replace(repoBase + "/#/admin");
      } else {
        window.location.replace(repoBase + "/#" + subPath);
      }
    </script>
  </head>
  <body>
    <p>Redirecting to PARACORPSE...</p>
  </body>
</html>
